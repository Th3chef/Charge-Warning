name: Bug report
description: A warning doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! The mod is sound only and writes no log, so please describe what you heard and when.
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: 3.1.0
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Railgun warning and Epoch warning (on/off and volume).
      placeholder: "Railgun warning Loud, Epoch warning Medium."
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version / date of the last game update
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you heard. Which weapon, safe or unsafe mode (Railgun), solo, hosting or joining someone else's game?
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Other mods that change the Railgun, the Epoch or their sounds, and your mod manager.
